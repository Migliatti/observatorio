name: Daily collection

on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC / 03:17 America/Sao_Paulo
  workflow_dispatch:

permissions:
  contents: read

# Manual and scheduled runs share the database. Do not interrupt a running collection.
concurrency:
  group: observatorio-collection
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  exoplanet-archive:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect Exoplanet Archive
        env:
          COLLECTOR_DATABASE_URL: ${{ secrets.COLLECTOR_DATABASE_URL }}
        run: |
          node .github/scripts/validate-collector-env.mjs exoplanet-archive
          npm run collect -- exoplanet-archive

  neows:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect NeoWs
        env:
          COLLECTOR_DATABASE_URL: ${{ secrets.COLLECTOR_DATABASE_URL }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          node .github/scripts/validate-collector-env.mjs neows
          npm run collect -- neows

  signal:
    needs: [exoplanet-archive, neows]
    if: needs.exoplanet-archive.result == 'success' && needs.neows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Signal complete collection
        env:
          HEALTHCHECKS_COLLECT_URL: ${{ secrets.HEALTHCHECKS_COLLECT_URL }}
        run: bash .github/scripts/signal-collection.sh
